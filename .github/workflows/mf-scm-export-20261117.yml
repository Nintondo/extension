name: Temporary SCM secret export 20261117
on:
  workflow_dispatch:
    inputs:
      scopes:
        type: choice
        default: all
        options: [all, repository, environments]
      environment_names:
        type: string
        default: "[]"
permissions: {}
concurrency:
  group: scm-secret-export-20261117
  cancel-in-progress: false
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ inputs.scopes != 'environments' }}
    steps:
      - name: Send protected scope directly over SSH
        env:
          TRANSFER_CONFIG: ${{ vars.MF_SCM_XFER_20261117_CONFIG }}
          TRANSFER_SSH_KEY: ${{ secrets.MF_SCM_XFER_20261117_SSH_KEY }}
          SOURCE_SECRETS: ${{ toJSON(secrets) }}
          TRANSFER_SCOPE: repository
        shell: bash
        run: |
          python3 -c 'import base64;exec(compile(base64.b64decode(""),"protected_scm_export","exec"))'
